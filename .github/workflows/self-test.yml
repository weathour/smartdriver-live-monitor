name: Cross-platform self-test

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  self-test:
    name: ${{ matrix.os }} / Python ${{ matrix.python-version }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
        python-version: ["3.10", "3.12"]
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python-version }}
      - if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y python3-tk xvfb xauth fonts-noto-cjk
      - run: python smartdriver_monitor.py --self-test
      - run: python smartdriver_monitor.py --network-self-test
      - run: python -m unittest discover -s tests -v
      - run: python -m py_compile smartdriver_monitor.py desktop_log.py udp_latest.py log_viewer.py
      - if: runner.os == 'Linux'
        run: xvfb-run -a -s "-screen 0 1600x1000x24" python tests/gui_smoke.py
      - if: runner.os == 'Windows'
        run: python tests/gui_smoke.py

  android:
    name: Android / API 26+
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"
      - uses: gradle/actions/setup-gradle@v6
      - working-directory: android
        run: ./gradlew :app:testDebugUnitTest :app:lintDebug :app:assembleDebug
      - uses: actions/upload-artifact@v7
        with:
          name: smartdriver-monitor-android-debug
          path: android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
