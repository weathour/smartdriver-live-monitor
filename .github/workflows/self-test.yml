name: Cross-platform self-test

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  self-test:
    name: ${{ matrix.os }} / Python ${{ matrix.python-version }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
        python-version: ["3.10", "3.12"]
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python-version }}
      - if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y python3-tk xvfb xauth fonts-noto-cjk
      - run: python smartdriver_monitor.py --self-test
      - if: runner.os == 'Linux'
        run: xvfb-run -a -s "-screen 0 1600x1000x24" python -c "import tkinter as tk; import smartdriver_monitor as m; root=tk.Tk(); app=m.SmartDriverApp(root); root.update_idletasks(); assert root.winfo_exists(); app.close(); print('GUI_SMOKE_TEST=OK')"
      - if: runner.os == 'Windows'
        run: python -c "import tkinter as tk; import smartdriver_monitor as m; root=tk.Tk(); app=m.SmartDriverApp(root); root.update_idletasks(); assert root.winfo_exists(); app.close(); print('GUI_SMOKE_TEST=OK')"
